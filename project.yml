name: SecurePatrol
options:
  bundleIdPrefix: com.densuper
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  SecurePatrol:
    type: application
    platform: iOS
    sources: [SecurePatrol]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.densuper.securepatrol
        INFOPLIST_KEY_NSCameraUsageDescription: "Scan registered security patrol checkpoint QR codes."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
  SecurePatrolTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SecurePatrolTests]
    dependencies:
      - target: SecurePatrol
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SecurePatrol:
    build:
      targets:
        SecurePatrol: all
    test:
      targets:
        - SecurePatrolTests
